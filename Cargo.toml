[package]
name = "SFTool"
version = "2.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.0"
byteorder = "1.5.0"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
encoding_rs = "0.8.41"
rfd = "0.17.2"
walkdir = "2.5.0"
regex = "1.13.1"
rayon = "1.12.0"
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["dds", "tga", "png"] }
image_dds = "0.7.2"
arboard = "3.6.1"
sha2 = "0.11.0"
memmap2 = "0.9.11"

[build-dependencies]
slint-build = "1.18.0"
